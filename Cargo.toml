[package]
name = "dnscacher"
version = "0.2.0"
edition = "2021"
description = "A caching DNS forwarder with UDP, TCP, DoT and DoH server and upstreams"
license = "MIT"
repository = "https://github.com/vibecoded-ezme/dnscacher"
readme = "README.md"

[dependencies]
# DNS
hickory-proto = "0.26"

# Async
tokio = { version = "1", features = ["full"] }

# Config & Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"
url = "2"

# Cache
moka = { version = "0.12", features = ["future"] }

# Persistence
postcard = { version = "1.2.0", default-features = false, features = ["use-std"] }

# Upstream transports
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"

# Inbound DoH HTTP server
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"

# Utilities
anyhow = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
